name: RPC full refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/ingestion/**"
      - "scripts/fetch_rpc_arrivals.py"
      - "scripts/profile_rpc_panel.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/rpc-full-refresh.yml"

concurrency:
  group: rpc-full-refresh-main
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install OCR system dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m scripts.fetch_rpc_arrivals
      - run: python -m scripts.profile_rpc_panel
      - name: Validate complete RPC outputs
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path

          annual = pd.read_csv("data/processed/rpc_state_fiscal_year.csv")
          monthly = pd.read_csv("data/processed/rpc_state_month.csv")
          national_monthly = pd.read_csv("data/processed/rpc_national_month.csv")
          summary = json.loads(Path("analysis/rpc_profile_summary.json").read_text())

          assert annual["fiscal_year"].min() <= 2012
          assert annual["fiscal_year"].max() >= 2025
          assert annual["state"].nunique() >= 50
          assert monthly["date"].min() <= "2023-10-01"
          assert monthly["state"].nunique() >= 40
          assert len(monthly) >= 1500
          assert national_monthly["fiscal_year"].min() <= 2021
          assert national_monthly["fiscal_year"].max() >= 2025
          assert summary["monthly_panel"]["months"] >= 24
          assert summary["monthly_panel"]["total_arrivals"] > 0

          print(summary)
          PY
      - name: Commit validated RPC datasets and profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             data/processed/rpc_state_fiscal_year.csv             data/processed/rpc_state_month.csv             data/raw/rpc_source_manifest.json             analysis/rpc_profile_summary.json             analysis/rpc_state_summary.csv             analysis/rpc_month_summary.csv

          if git diff --cached --quiet; then
            echo "No RPC analytical outputs changed."
            exit 0
          fi

          git commit -m "Refresh complete RPC analytical panels"
          git pull --rebase origin main
          git push origin main
