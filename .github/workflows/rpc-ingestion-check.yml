name: RPC ingestion check

on:
  push:
    branches: [main]
    paths:
      - "src/ingestion/rpc.py"
      - "scripts/fetch_rpc_arrivals.py"
      - "tests/test_rpc_ingestion.py"
      - "requirements.txt"
      - ".github/workflows/rpc-ingestion-check.yml"
  workflow_dispatch:

jobs:
  rpc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Validate representative source formats
        run: |
          python - <<'PY'
          from datetime import datetime, timezone

          import requests

          from src.ingestion.rpc import (
              discover_rpc_sources,
              parse_state_fiscal_year_bytes,
              parse_state_month_bytes,
          )

          sources = discover_rpc_sources()
          years = [source.fiscal_year for source in sources]

          assert min(years) <= 2012
          assert 2025 in years
          assert 2019 in years
          assert 2018 in years

          source_2025 = next(
              source for source in sources if source.fiscal_year == 2025
          )
          response_2025 = requests.get(source_2025.url, timeout=120)
          response_2025.raise_for_status()

          monthly_2025 = parse_state_month_bytes(
              source_2025,
              response_2025.content,
              datetime.now(timezone.utc).isoformat(),
          )
          annual_2025 = parse_state_fiscal_year_bytes(
              source_2025,
              response_2025.content,
              datetime.now(timezone.utc).isoformat(),
          )

          assert monthly_2025["state"].nunique() >= 40
          assert len(monthly_2025) >= 400
          assert monthly_2025["arrivals"].sum() > 0
          assert "Texas" in set(monthly_2025["state"])
          assert annual_2025["state"].nunique() >= 40

          legacy_results = {}
          for fiscal_year in (2019, 2018):
              source = next(
                  source for source in sources
                  if source.fiscal_year == fiscal_year
              )
              response = requests.get(source.url, timeout=120)
              response.raise_for_status()

              annual = parse_state_fiscal_year_bytes(
                  source,
                  response.content,
                  datetime.now(timezone.utc).isoformat(),
              )

              assert annual["state"].nunique() >= 40
              assert annual["arrivals"].sum() > 0
              assert "Texas" in set(annual["state"])

              legacy_results[fiscal_year] = {
                  "file_type": source.file_type,
                  "rows": len(annual),
                  "states": int(annual["state"].nunique()),
                  "arrivals": int(annual["arrivals"].sum()),
              }

          assert source_2025.file_type == "pdf"
          assert legacy_results[2019]["file_type"] == "xlsx"
          assert legacy_results[2018]["file_type"] == "xls"

          print(
              {
                  "sources": len(sources),
                  "source_years": [min(years), max(years)],
                  "file_types": sorted({source.file_type for source in sources}),
                  "fy2025_monthly_rows": len(monthly_2025),
                  "fy2025_monthly_states": int(monthly_2025["state"].nunique()),
                  "legacy_annual": legacy_results,
              }
          )
          PY
