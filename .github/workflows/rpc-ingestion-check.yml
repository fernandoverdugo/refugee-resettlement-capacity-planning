name: RPC ingestion check

on:
  push:
    branches: [main]
    paths:
      - "src/ingestion/rpc.py"
      - "scripts/fetch_rpc_arrivals.py"
      - "tests/test_rpc_ingestion.py"
      - "requirements.txt"
      - ".github/workflows/rpc-ingestion-check.yml"
  workflow_dispatch:

jobs:
  rpc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Validate source discovery and representative source formats
        run: |
          python - <<'PY'
          from datetime import datetime, timezone

          import requests

          from src.ingestion.rpc import discover_rpc_sources, parse_source_bytes

          sources = discover_rpc_sources()
          years = [source.fiscal_year for source in sources]

          assert min(years) <= 2012
          assert 2025 in years
          assert 2019 in years
          assert 2018 in years

          results = {}

          for fiscal_year in (2025, 2019, 2018):
              source = next(
                  source for source in sources
                  if source.fiscal_year == fiscal_year
              )

              response = requests.get(source.url, timeout=120)
              response.raise_for_status()

              try:
                  frame = parse_source_bytes(
                      source,
                      response.content,
                      datetime.now(timezone.utc).isoformat(),
                  )
              except Exception:
                  if source.file_type in {"xls", "xlsx"}:
                      from src.ingestion.rpc import excel_rows
                      rows = excel_rows(response.content)
                      print(f"FY{fiscal_year} Excel rows:", len(rows))
                      for row in rows[:60]:
                          print(row)
                  raise

              assert frame["state"].nunique() >= 40
              assert len(frame) >= 400
              assert frame["arrivals"].sum() > 0
              assert "Texas" in set(frame["state"])

              results[fiscal_year] = {
                  "file_type": source.file_type,
                  "rows": len(frame),
                  "states": int(frame["state"].nunique()),
                  "arrivals": int(frame["arrivals"].sum()),
              }

          assert results[2025]["file_type"] == "pdf"
          assert results[2019]["file_type"] == "xlsx"
          assert results[2018]["file_type"] == "xls"

          print(
              {
                  "sources": len(sources),
                  "source_years": [min(years), max(years)],
                  "file_types": sorted({source.file_type for source in sources}),
                  "representative_results": results,
              }
          )
          PY
