name: ACS capacity refresh

on:
  workflow_dispatch:

concurrency:
  group: acs-capacity-refresh-main
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Build ACS state capacity panel
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python -m scripts.fetch_acs_capacity
      - name: Validate ACS output
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path

          frame = pd.read_csv("data/processed/acs_state_capacity.csv")
          summary = json.loads(
              Path("analysis/acs_capacity_summary.json").read_text()
          )

          assert frame["state"].nunique() == 51
          assert frame["acs_year"].nunique() == 4
          assert set(frame["acs_year"].unique()) == {2021, 2022, 2023, 2024}
          assert len(frame) == 204
          assert summary["rows"] == len(frame)
          assert summary["states"] == 51
          assert summary["latest_year"] == 2024
          PY
      - name: Commit validated ACS outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             data/processed/acs_state_capacity.csv             analysis/acs_variable_metadata.json             analysis/acs_capacity_summary.json

          if git diff --cached --quiet; then
            echo "No ACS outputs changed."
            exit 0
          fi

          git commit -m "Refresh ACS capacity indicators"
          git pull --rebase origin main
          git push origin main
